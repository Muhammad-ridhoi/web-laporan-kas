<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aplikasi Laporan Kas</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-light">
    <div class="container mt-4">
      <h1 class="text-center me-3">📊 Dashboard Laporan Kas</h1>

      <div class="row mb-4">
        <div class="col-md-4 mb-3">
          <div class="card text-white bg-success">
            <div class="card-header">Total Pemasukan</div>
            <div class="card-body">
              <h4 class="card-title" id="totalPemasukan">
                <span class="spinner-border spinner-border-sm"></span>
              </h4>
            </div>
          </div>
        </div>
        <div class="col-md-4 mb-3">
          <div class="card text-white bg-danger">
            <div class="card-header">Total Pengeluaran</div>
            <div class="card-body">
              <h4 class="card-title" id="totalPengeluaran">
                <span class="spinner-border spinner-border-sm"></span>
              </h4>
            </div>
          </div>
        </div>
        <div class="col-md-4 mb-3">
          <div class="card text-dark bg-warning">
            <div class="card-header">Saldo Akhir</div>
            <div class="card-body">
              <h4 class="card-title" id="saldoAkhir">
                <span class="spinner-border spinner-border-sm"></span>
              </h4>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-body">
          <h3 class="card-title text-center mb-4">📝 Tambah Transaksi Baru</h3>
          <form id="kasForm">
            <div class="mb-3">
              <label for="tanggal" class="form-label">Tanggal</label>
              <input type="date" class="form-control" id="tanggal" required />
            </div>
            <div class="mb-3">
              <label for="keterangan" class="form-label">Keterangan</label>
              <input
                type="text"
                class="form-control"
                id="keterangan"
                placeholder="Contoh: Beli Kopi"
                required
              />
            </div>
            <div class="mb-3">
              <label for="jenis" class="form-label">Jenis Transaksi</label>
              <select class="form-select" id="jenis" required>
                <option value="" selected disabled>-- Pilih Jenis --</option>
                <option value="pemasukan">Pemasukan</option>
                <option value="pengeluaran">Pengeluaran</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="jumlah" class="form-label">Jumlah (Rp)</label>
              <input
                type="text"
                class="form-control"
                id="jumlah"
                placeholder="Contoh: 25000"
                inputmode="numeric"
                required
              />
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary">
                Simpan Laporan
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
